name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          sudo apt-get update
          sudo apt-get install -y tmux zsh
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q features shared installer
          bash -n features/external-notifications/adapters/androidtools/*.sh
          bash -n integration-tests/test_tmux_integration.sh
          zsh -n features/ssh-autoattach/shell/tmux-ssh.zsh
      - name: Isolated tmux integration
        shell: bash
        run: |
          set +e
          bash -x ./integration-tests/test_tmux_integration.sh > tmux-integration.log 2>&1
          status=$?
          cat tmux-integration.log
          exit "$status"
      - name: Upload tmux integration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmux-integration-log
          path: tmux-integration.log
