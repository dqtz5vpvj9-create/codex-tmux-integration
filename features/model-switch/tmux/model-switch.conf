# Managed by codex-tmux-integration: model-switch

# Presets intentionally replace tmux's default prefix+1..4 window bindings.
# Each preset resolves to the vocabulary of whichever agent owns the pane.
bind-key 1 run-shell -b '"$HOME/.local/bin/codex-tmux-model-switch" --socket #{q:socket_path} --pane #{q:pane_id} apply --preset 1'
bind-key 2 run-shell -b '"$HOME/.local/bin/codex-tmux-model-switch" --socket #{q:socket_path} --pane #{q:pane_id} apply --preset 2'
bind-key 3 run-shell -b '"$HOME/.local/bin/codex-tmux-model-switch" --socket #{q:socket_path} --pane #{q:pane_id} apply --preset 3'
bind-key 4 run-shell -b '"$HOME/.local/bin/codex-tmux-model-switch" --socket #{q:socket_path} --pane #{q:pane_id} apply --preset 4'

# Resolve socket/pane in run-shell before display-popup creates its popup pane.
bind-key g run-shell -b '"$HOME/.local/bin/codex-tmux-model-popup" --socket #{q:socket_path} --pane #{q:pane_id}'
