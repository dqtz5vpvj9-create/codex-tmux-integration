# Managed by codex-tmux-integration: pane-logging
set-hook -g 'session-created[70]' 'run-shell -b "$HOME/.local/bin/tmux-autolog --socket #{q:socket_path} sweep"'
set-hook -g 'after-new-window[70]' 'run-shell -b "$HOME/.local/bin/tmux-autolog --socket #{q:socket_path} pane #{pane_id}"'
set-hook -g 'after-split-window[70]' 'run-shell -b "$HOME/.local/bin/tmux-autolog --socket #{q:socket_path} pane #{pane_id}"'
