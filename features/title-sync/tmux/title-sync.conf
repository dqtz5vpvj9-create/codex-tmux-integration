# Managed by codex-tmux-integration: title-sync
set-hook -g 'pane-focus-in[50]' 'run-shell -b "$HOME/.local/bin/codex-tmux-title-sync --socket #{q:socket_path} --pane #{pane_id}"'
set-hook -g 'after-select-pane[50]' 'run-shell -b "$HOME/.local/bin/codex-tmux-title-sync --socket #{q:socket_path} --pane #{pane_id}"'
set-hook -g 'after-select-window[50]' 'run-shell -b "$HOME/.local/bin/codex-tmux-title-sync --socket #{q:socket_path} --pane #{pane_id}"'

set -g automatic-rename off
setw -g allow-set-title off
setw -gu automatic-rename-format
