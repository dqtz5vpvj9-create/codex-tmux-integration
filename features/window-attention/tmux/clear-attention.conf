# Managed by codex-tmux-integration: window-attention
set-hook -g 'after-select-window[60]' 'run-shell -b "tmux set-window-option -u -t #{window_id} window-status-style 2>/dev/null"'
set-hook -g 'after-select-pane[60]' 'run-shell -b "tmux set-window-option -u -t #{window_id} window-status-style 2>/dev/null"'
set-hook -g 'client-attached[60]' 'run-shell -b "tmux set-window-option -u -t #{window_id} window-status-style 2>/dev/null"'
set-hook -g 'client-focus-in[60]' 'run-shell -b "tmux set-window-option -u -t #{window_id} window-status-style 2>/dev/null"'
