[tool.pytest.ini_options]
# picker-rs/tests is a standalone script that drives the built Rust binary on a
# pty; it is run by hand (see its README), not collected.
addopts = "-ra --ignore=features/ssh-autoattach/picker-rs"
testpaths = [
  "features",
  "shared",
  "installer",
]
python_files = ["test_*.py"]
